<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하루하루">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>하루하루 일정</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<script>/* 잠금 화면이 깜빡이지 않도록 테마를 먼저 칠합니다. */
try{var __t=JSON.parse(localStorage.getItem("haruharu.theme.v1")||"null");if(__t)document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<style>
  :root{
    --ph: 64px;                     /* 1시간 높이 */
    --r: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
            "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --class: #5B8CFF;   --class-soft: rgba(91,140,255,.15);
    --task: #FF6B6B;    --task-soft: rgba(255,107,107,.15);
    --contest: #B47BFF; --contest-soft: rgba(180,123,255,.15);
    --life: #22C3A0;    --life-soft: rgba(34,195,160,.15);
  }
  html[data-theme="dark"],html:not([data-theme]){
    --bg:#0B0D12; --bg2:#0E1118;
    --surface:#151922; --surface2:#1A1F2B; --surface3:#222836;
    --text:#E9EDF5; --text2:#C3CAD8; --muted:#8A93A6;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --accent:#6B95FF; --accent-ink:#0B0D12;
    --shadow: 0 8px 24px rgba(0,0,0,.38);
    --glow: 0 0 0 1px rgba(255,255,255,.05);
  }
  html[data-theme="light"]{
    --bg:#F2F5FA; --bg2:#E9EEF7;
    --surface:#FFFFFF; --surface2:#F5F7FC; --surface3:#EAEEF7;
    --text:#0F1320; --text2:#2C3444; --muted:#6C7686;
    --line:rgba(15,19,32,.08); --line2:rgba(15,19,32,.14);
    --accent:#2F6BFF; --accent-ink:#FFFFFF;
    --shadow: 0 8px 22px rgba(23,38,74,.10);
    --glow: 0 0 0 1px rgba(15,19,32,.03);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg2) 0%, var(--bg) 60%) no-repeat,
      var(--bg);
    color:var(--text); font-family:var(--font);
    font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px;
       padding-bottom:calc(96px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:30;
    padding:12px 16px 8px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 8px;
    background:var(--bg);
    background:linear-gradient(180deg, var(--bg) 62%, color-mix(in srgb, var(--bg) 88%, transparent) 100%);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .date-block{min-width:0}
  .brand{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--muted);margin-bottom:2px}
  .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .top-actions{display:flex;gap:6px}
  .icon-btn{
    width:34px;height:34px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);color:var(--text2);
  }
  .icon-btn:active{transform:scale(.95)}
  .icon-btn svg{width:18px;height:18px}

  .dmain{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .dmain .dow{font-size:19px;font-weight:700;color:var(--text2);margin-left:2px}
  .dmain .dow.sun{color:#FF7A7A}
  .dmain .dow.sat{color:#6FA0FF}
  .dsub{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--text2)}
  .pill.today{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 40%, transparent)}

  .mini{display:inline-block;width:30px;height:3px;border-radius:99px;background:var(--surface3);overflow:hidden;vertical-align:middle;margin-right:5px}
  .mini i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .35s ease}
  .pill.prog{display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums}

  .nav-row{display:flex;gap:8px;margin-top:10px}
  .nav-btn{
    flex:1;height:38px;border-radius:12px;font-size:13.5px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);color:var(--text2);
    display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .18s, color .18s, transform .12s;
  }
  .nav-btn:active{transform:scale(.97)}
  .nav-btn.center{flex:1.15;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
  .nav-btn.center.ghost{background:var(--surface);color:var(--accent);border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
  .nav-btn svg{width:13px;height:13px;opacity:.8}

  /* ---------- week strip ---------- */
  .week{display:flex;gap:3px;padding:9px 9px 5px}
  .wday{
    flex:1 1 0;min-width:0;box-sizing:border-box;
    border-radius:13px;padding:6px 0 8px;text-align:center;line-height:1;
    border:1px solid transparent;transition:background .18s,border-color .18s;
  }
  .wday:active{background:var(--surface2)}
  .wday .wd{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
  .wday .wn{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .wday.sun .wd,.wday.sun .wn{color:#FF8A8A}
  .wday.sat .wn{color:#7FA8FF}
  .wday.sel{background:var(--accent);border-color:transparent}
  .wday.sel .wd,.wday.sel .wn{color:var(--accent-ink)}
  .wday.today:not(.sel){border-color:color-mix(in srgb, var(--accent) 55%, transparent);background:var(--class-soft)}
  .dots{display:block;height:4px;line-height:0;margin-top:5px}
  .dots i{display:inline-block;width:4px;height:4px;border-radius:50%;margin:0 1.5px;vertical-align:top}
  .dots i.empty{background:transparent!important;opacity:0!important}
  .wday.sel .dots i:not(.empty){background:var(--accent-ink)!important;opacity:.85}

  /* ---------- filters ---------- */
  .filters{
    display:flex;gap:7px;overflow-x:auto;padding:4px 14px 12px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;gap:6px;transition:all .18s;
  }
  .chip .num{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{color:var(--text);background:var(--surface3);border-color:var(--line2)}
  .chip[data-cat="class"][aria-pressed="true"]{color:var(--class);border-color:color-mix(in srgb,var(--class) 45%,transparent);background:var(--class-soft)}
  .chip[data-cat="task"][aria-pressed="true"]{color:var(--task);border-color:color-mix(in srgb,var(--task) 45%,transparent);background:var(--task-soft)}
  .chip[data-cat="contest"][aria-pressed="true"]{color:var(--contest);border-color:color-mix(in srgb,var(--contest) 45%,transparent);background:var(--contest-soft)}
  .chip[data-cat="life"][aria-pressed="true"]{color:var(--life);border-color:color-mix(in srgb,var(--life) 45%,transparent);background:var(--life-soft)}
  .chip i{width:7px;height:7px;border-radius:50%}

  /* ---------- main ---------- */
  main{padding:0 14px;transition:opacity .16s ease, transform .16s ease}
  main.slide-l{opacity:.25;transform:translateX(-12px)}
  main.slide-r{opacity:.25;transform:translateX(12px)}

  .span-banner{
    display:flex;align-items:center;gap:8px;margin:2px 0 10px;padding:9px 12px;
    border-radius:12px;background:var(--surface2);border:1px dashed var(--line2);
    font-size:12.5px;color:var(--text2);
  }
  .span-banner .k{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:1px 5px;flex:0 0 auto}

  .sec-h{
    display:flex;align-items:center;gap:8px;margin:16px 2px 8px;
    font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  }
  .sec-h .rule{flex:1;height:1px;background:var(--line)}
  .sec-h .cnt{font-weight:600;letter-spacing:0;color:var(--muted);font-size:11px}

  /* pinned cards */
  .pin{display:flex;flex-direction:column;gap:8px}
  .card{
    position:relative;display:flex;gap:10px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 12px 11px 13px;box-shadow:var(--glow);overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .card.cat-class{--c:var(--class)} .card.cat-task{--c:var(--task)}
  .card.cat-contest{--c:var(--contest)} .card.cat-life{--c:var(--life)}
  .ck{
    flex:0 0 auto;width:21px;height:21px;border-radius:7px;border:1.8px solid var(--line2);
    display:grid;place-items:center;margin-top:1px;transition:all .16s;background:transparent;
  }
  .ck svg{width:13px;height:13px;opacity:0;transform:scale(.6);transition:all .16s;stroke:var(--accent-ink)}
  .ck[aria-checked="true"]{background:var(--c);border-color:var(--c)}
  .ck[aria-checked="true"] svg{opacity:1;transform:scale(1)}
  .body{flex:1;min-width:0}
  .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .tm{font-size:11.5px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
  .tag{
    font-size:10px;font-weight:700;letter-spacing:.02em;padding:1.5px 6px;border-radius:6px;
    background:var(--c-soft,var(--surface3));color:var(--c);
  }
  .card .tag{background:color-mix(in srgb, var(--c) 14%, transparent)}
  .title{font-size:14.5px;font-weight:650;line-height:1.35;letter-spacing:-.01em;word-break:keep-all}
  .sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card.done{opacity:.55}
  .card.done .title{text-decoration:line-through;text-decoration-thickness:1.5px}

  /* timeline */
  .tl{position:relative;margin-top:6px}
  .hlabels{position:absolute;left:0;top:0;width:44px}
  .hlabels .h{position:absolute;left:0;right:0;font-size:10.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;transform:translateY(-6px);text-align:right;padding-right:7px}
  .track{position:relative;margin-left:48px;border-left:1px solid var(--line);
    min-height:120px}
  .gline{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.6}
  .gline.half{opacity:.28}
  .now{position:absolute;left:-5px;right:0;height:0;z-index:5;pointer-events:none}
  .now::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#FF5E5E,rgba(255,94,94,.15));border-radius:2px}
  .now::after{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#FF5E5E;box-shadow:0 0 10px rgba(255,94,94,.8)}
  .ev{
    position:absolute;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--c);
    padding:6px 34px 6px 9px;overflow:hidden;text-align:left;z-index:2;
    transition:transform .12s ease;
  }
  .ev:active{transform:scale(.985)}
  .ev.cat-class{--c:var(--class);background:linear-gradient(120deg,var(--class-soft) 0%,var(--surface) 62%)}
  .ev.cat-task{--c:var(--task);background:linear-gradient(120deg,var(--task-soft) 0%,var(--surface) 62%)}
  .ev.cat-contest{--c:var(--contest);background:linear-gradient(120deg,var(--contest-soft) 0%,var(--surface) 62%)}
  .ev.cat-life{--c:var(--life);background:linear-gradient(120deg,var(--life-soft) 0%,var(--surface) 62%)}
  .ev .et{font-size:11px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .ev .en{font-size:13.5px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
  .ev .el{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ev .ck{position:absolute;right:6px;top:6px;width:19px;height:19px;border-radius:6px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
  .ev.tiny{padding-top:4px;padding-bottom:4px}
  .ev.tiny .en{font-size:12.5px;-webkit-line-clamp:1}
  .ev.tiny .el{display:none}
  .ev.done{opacity:.5}
  .ev.done .en{text-decoration:line-through}

  /* memo */
  .memo{margin-top:6px;display:flex;flex-direction:column;gap:7px}
  .memo-item{display:flex;gap:9px;align-items:flex-start;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13.5px;
    white-space:pre-wrap;word-break:break-word;color:var(--text2)}
  .memo-item .mtxt{flex:1;min-width:0}
  .memo-item .mdel{flex:0 0 auto;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
  .memo-add{display:flex;gap:8px;margin-top:2px}
  .memo-add input{
    flex:1;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
    color:var(--text);padding:0 12px;font-size:13.5px;font-family:inherit;
  }
  .memo-add input::placeholder{color:var(--muted)}
  .memo-add button{
    flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--surface3);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-size:19px;
  }
  .memo-add button:active{transform:scale(.94)}

  .empty{
    margin:26px 0 8px;padding:34px 18px;border-radius:18px;text-align:center;
    background:var(--surface2);border:1px dashed var(--line2);
  }
  .empty .e1{font-size:26px;margin-bottom:6px}
  .empty .e2{font-size:14px;font-weight:650;color:var(--text2)}
  .empty .e3{font-size:12.5px;color:var(--muted);margin-top:3px}
  .footnote{margin:26px 4px 8px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}

  /* fab */
  .fab{
    position:fixed;right:18px;bottom:20px;
    right:max(18px, calc(50% - 260px + 18px));bottom:calc(20px + env(safe-area-inset-bottom));
    width:54px;height:54px;border-radius:19px;z-index:35;
    background:linear-gradient(150deg,#7FA6FF,var(--accent));color:#fff;
    display:grid;place-items:center;box-shadow:0 10px 26px rgba(60,110,255,.42);
    font-size:25px;font-weight:300;transition:transform .15s;
  }
  .fab:active{transform:scale(.93)}
  html[data-theme="light"] .fab{color:#fff}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);
    z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;
    max-width:520px;margin:0 auto;
    background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;
    border-top:1px solid var(--line2);
    transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.9,.25,1);
    max-height:88vh;display:flex;flex-direction:column;
    padding-bottom:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:9px auto 4px;flex:0 0 auto}
  .sheet-body{overflow-y:auto;padding:10px 20px 22px;-webkit-overflow-scrolling:touch}
  .sheet h2{font-size:19px;font-weight:750;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.35;word-break:keep-all}
  .sheet .smeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
  .sheet .srow{display:flex;gap:8px;font-size:13.5px;color:var(--text2);padding:9px 0;border-top:1px solid var(--line)}
  .sheet .srow .k{flex:0 0 64px;color:var(--muted);font-size:12.5px;padding-top:1px}
  .sheet .desc{white-space:pre-wrap;font-size:13.5px;color:var(--text2);line-height:1.62;word-break:break-word}
  .sheet .act{display:flex;gap:9px;margin-top:16px}
  .btn{
    flex:1;height:46px;border-radius:14px;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--surface3);border:1px solid var(--line);color:var(--text);
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn:active{transform:scale(.98)}
  .btn svg{width:16px;height:16px}
  textarea.memo-input{
    width:100%;min-height:104px;border-radius:14px;background:var(--surface2);
    border:1px solid var(--line);color:var(--text);padding:12px;font-size:14px;
    font-family:inherit;resize:vertical;line-height:1.55;
  }
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .info-h{font-size:12px;font-weight:750;color:var(--accent);letter-spacing:.04em;margin:18px 0 6px}
  .info-list{margin:0;padding-left:16px;font-size:13px;color:var(--text2);line-height:1.7}
  .info-list li{margin:2px 0}
  .toast{
    position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);
    bottom:calc(88px + env(safe-area-inset-bottom));
    background:var(--surface3);border:1px solid var(--line2);color:var(--text);
    padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:600;z-index:60;
    opacity:0;pointer-events:none;transition:all .22s;box-shadow:var(--shadow);white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 잠금 화면 ---------- */
  #appRoot[hidden],.lock[hidden]{display:none!important}
  .lock{
    position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 70% at 50% -10%, var(--bg2) 0%, var(--bg) 62%) no-repeat,
      var(--bg);
    overflow-y:auto;
  }
  .lock-card{width:100%;max-width:372px;text-align:center;animation:lockIn .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes lockIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .lock-ic{width:80px;height:80px;border-radius:21px;display:block;margin:0 auto 16px;
            box-shadow:0 14px 34px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06)}
  .lock-badge{display:table;margin:0 auto 12px;font-size:10px;font-weight:800;letter-spacing:.08em;
              color:var(--accent);background:var(--class-soft);padding:4px 9px;border-radius:999px}
  .lock-badge svg{width:11px;height:11px;margin-right:5px;vertical-align:-1px}
  .lock-badge svg{width:11px;height:11px}
  .lock-title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 7px}
  .lock-sub{font-size:12.5px;color:var(--muted);margin:0 auto 20px;line-height:1.6;max-width:300px}
  .lock-field{position:relative;background:var(--surface);border:1px solid var(--line2);
               border-radius:14px;transition:border-color .18s, box-shadow .18s}
  .lock-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent)}
  .lock-field input{display:block;width:100%;box-sizing:border-box;background:none;border:0;outline:none;
                    color:var(--text);font-size:16px;padding:13px 50px 13px 15px;font-family:inherit;
                    letter-spacing:.02em;border-radius:14px}
  .lock-field input::placeholder{color:var(--muted);letter-spacing:0}
  .lock-eye{position:absolute;right:5px;top:50%;margin-top:-19px;width:38px;height:38px;
            border-radius:10px;display:block;text-align:center;line-height:38px;color:var(--muted)}
  .lock-eye:active{background:var(--surface3)}
  .lock-eye svg{width:19px;height:19px;vertical-align:middle}
  .lock-btn{width:100%;margin-top:11px;background:var(--accent);color:var(--accent-ink);
            font-weight:800;font-size:15px;padding:14px;border-radius:14px;
            transition:transform .12s, opacity .18s}
  .lock-btn:active{transform:scale(.985)}
  .lock-btn:disabled{opacity:.6}
  .lock-msg{min-height:18px;font-size:12.5px;margin:9px 2px 0;color:var(--muted);line-height:1.5}
  .lock-msg.err{color:#FF7B7B}
  html[data-theme="light"] .lock-msg.err{color:#D93A3A}
  .lock-keep{display:flex;align-items:flex-start;gap:10px;text-align:left;margin-top:16px;padding:12px 13px;
             border:1px solid var(--line);border-radius:13px;background:var(--surface2);cursor:pointer}
  .lock-keep input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 20px;
                   margin:0;border-radius:6px;border:1.5px solid var(--line2);background:var(--surface);position:relative;cursor:pointer}
  .lock-keep input:checked{background:var(--accent);border-color:var(--accent)}
  .lock-keep input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
                                  border:2px solid var(--accent-ink);border-top:0;border-left:0;transform:rotate(42deg)}
  .lock-keep .kt{font-size:12.5px;font-weight:750;color:var(--text2)}
  .lock-keep .kd{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px;line-height:1.5}
  .lock-foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}
  .lock-foot span{margin:0 3px}
  .lock-link{font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .lock-link:active{color:var(--text2)}
  .lock-badv .lock-card{animation:shake .42s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
                   30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

  /* ---------- 앱 정보 시트: 보안 ---------- */
  .sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
           border-top:1px solid var(--line)}
  .sec-row:first-of-type{border-top:0}
  .sec-row .sl{font-size:13px;font-weight:700;color:var(--text2)}
  .sec-row .sd{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
  .switch{width:46px;height:27px;border-radius:999px;background:var(--surface3);border:1px solid var(--line2);
          position:relative;flex:0 0 46px;transition:background .18s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:999px;
                 background:var(--muted);transition:transform .18s, background .18s}
  .switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
  .switch[aria-checked="true"]::after{transform:translateX(19px);background:var(--accent-ink)}
  .danger{color:#FF7B7B}
  html[data-theme="light"] .danger{color:#D93A3A}

  @media (max-width:360px){
    .dmain{font-size:24px}
    .nav-btn{font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<!-- ================= 잠금 화면 ================= -->
<div class="lock" id="lock">
  <div class="lock-card">
    <img class="lock-ic" src="./icon-192.png" width="80" height="80" alt="">
    <div class="lock-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
      AES-256-GCM
    </div>
    <h1 class="lock-title">하루하루 일정</h1>
    <p class="lock-sub">암호로 잠근 일정입니다.<br>비밀번호는 이 기기 밖으로 나가지 않습니다.</p>

    <form id="lockForm" autocomplete="off" novalidate>
      <div class="lock-field">
        <input id="lockPw" type="password" inputmode="text" autocomplete="current-password"
               autocapitalize="off" spellcheck="false" placeholder="비밀번호" enterkeyhint="go"
               aria-label="비밀번호" aria-describedby="lockMsg">
        <button type="button" class="lock-eye" id="lockEye" aria-label="비밀번호 보기" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/></svg>
        </button>
      </div>
      <button class="lock-btn" id="lockBtn" type="submit">잠금 해제</button>
      <p class="lock-msg" id="lockMsg" role="status" aria-live="polite"></p>
    </form>

    <label class="lock-keep" for="lockKeep">
      <input type="checkbox" id="lockKeep">
      <span>
        <span class="kt">잠금 유지</span>
        <span class="kd">끄면 앱을 1분 이상 띄우지 않을 때 자동으로 다시 잠깁니다. 켜면 직접 잠글 때까지 유지됩니다.</span>
      </span>
    </label>

    <div class="lock-foot">
      <button type="button" class="lock-link" id="lockLogout">로그아웃</button>
      <span>·</span>
      <span>비밀번호는 전송·저장되지 않습니다</span>
    </div>
  </div>
</div>

<!-- ================= 앱 본문 (잠금 해제 후 표시) ================= -->
<div id="appRoot" hidden>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="date-block">
        <div class="brand"><span class="dot"></span>하루하루</div>
        <div class="dmain" id="dmain">11월 18일 <span class="dow">수요일</span></div>
        <div class="dsub" id="dsub"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="nowLockBtn" aria-label="지금 잠금" title="지금 잠금">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="라이트/다크 테마 전환">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        </button>
        <button class="icon-btn" id="infoBtn" aria-label="앱 정보와 데이터 출처">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg>
        </button>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        어제
      </button>
      <button class="nav-btn center" id="todayBtn">오늘</button>
      <button class="nav-btn" id="nextBtn">
        내일
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="week" id="week"></div>
    <div class="filters" id="filters"></div>
  </header>

  <main id="main" aria-live="polite"></main>
  <div class="footnote" id="footnote"></div>
</div>

<button class="fab" id="fab" aria-label="빠른 메모 추가">+</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
</div><!-- /#appRoot -->

<noscript><p style="padding:24px">이 앱은 자바스크립트가 필요합니다.</p></noscript>

  var MAGIC = [0x48, 0x48, 0x45, 0x31];   /* "HHE1" */
  var KEEP_KEY = "haruharu.keep.v1";
  var AUTOLOCK_MS = 60 * 1000;            /* 잠금 유지가 꺼져 있을 때 백그라운드 허용 시간 */
  var MAX_FAILS = 5;

  var lockEl   = document.getElementById("lock");
  var appEl    = document.getElementById("appRoot");
  var form     = document.getElementById("lockForm");
  var pw       = document.getElementById("lockPw");
  var msgEl    = document.getElementById("lockMsg");
  var btn      = document.getElementById("lockBtn");
  var eye      = document.getElementById("lockEye");
  var keepEl   = document.getElementById("lockKeep");
  var logoutEl = document.getElementById("lockLogout");

  var sealed = null;      /* 파싱된 암호문 조각 */
  var booted = false;     /* 앱 스크립트를 한 번이라도 초기화했는지 */
  var busy = false;
  var fails = 0;
  var cooldownUntil = 0;
  var hiddenAt = 0;

  /* ---------- 유틸 ---------- */
  function b64urlToBytes(s){
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function parseSealed(raw){
    var dot = raw.indexOf(".");
    var b = b64urlToBytes(dot > -1 ? raw.slice(dot + 1) : raw);
    for (var i = 0; i < 4; i++){
      if (b[i] !== MAGIC[i]) throw new Error("앱 데이터 형식이 올바르지 않습니다.");
    }
    if (b.length < 4 + 4 + 16 + 12 + 16) throw new Error("앱 데이터가 잘렸습니다.");
    var iter = ((b[4] << 24) | (b[5] << 16) | (b[6] << 8) | b[7]) >>> 0;
    if (iter < 100000) throw new Error("반복 횟수가 너무 적습니다.");
    return {
      iter: iter,
      salt: b.subarray(8, 24),
      iv: b.subarray(24, 36),
      ct: b.subarray(36),
      aad: b.subarray(0, 24)
    };
  }
  function showMsg(text, kind){
    msgEl.textContent = text || "";
    msgEl.className = "lock-msg" + (kind ? " " + kind : "");
  }
  function saveKeep(on){
    try { localStorage.setItem(KEEP_KEY, on ? "1" : "0"); } catch(e){}
    syncKeep();
  }
  function loadKeep(){
    try { return localStorage.getItem(KEEP_KEY) === "1"; } catch(e){ return false; }
  }
  function syncKeep(){
    var on = loadKeep();
    if (keepEl) keepEl.checked = on;
    var sw = document.getElementById("keepSwitch");
    if (sw) sw.setAttribute("aria-checked", on ? "true" : "false");
    var tx = document.getElementById("keepState");
    if (tx) tx.textContent = on ? "켜짐 · 화면을 닫기 전까지 잠기지 않습니다" : "꺼짐 · 1분 넘게 백그라운드에 두면 자동으로 잠깁니다";
  }
  function setLocked(locked){
    lockEl.hidden = !locked;
    appEl.hidden = locked;
    document.body.style.overflow = locked ? "" : "";
    if (locked){
      pw.value = "";
      if (window.matchMedia && window.matchMedia("(pointer:fine)").matches){
        try { pw.focus(); } catch(e){}
      }
    }
    document.documentElement.setAttribute("data-locked", locked ? "1" : "0");
  }

  /* ---------- 복호화 ---------- */
  async function deriveKey(passphrase, salt, iter){
    var base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function openSealed(passphrase){
    var key = await deriveKey(passphrase, sealed.salt, sealed.iter);
    var buf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: sealed.iv, additionalData: sealed.aad, tagLength: 128 },
      key, sealed.ct);
    var text = new TextDecoder("utf-8").decode(buf);
    var list = JSON.parse(text);
    if (!Array.isArray(list) || !list.length) throw new Error("빈 일정 데이터");
    return list;
  }

  function bootApp(list){
    if (!booted){
      booted = true;
      window.__hhBootApp(list);
    } else if (window.__hhSetEvents){
      window.__hhSetEvents(list);
    }
  }

  async function unlock(ev){
    if (ev) ev.preventDefault();
    if (busy) return;
    var now = Date.now();
    if (now < cooldownUntil){
      showMsg("조금 뒤에 다시 시도해 주세요. (" + Math.ceil((cooldownUntil - now) / 1000) + "초)", "err");
      return;
    }
    var pass = pw.value;
    if (!pass){ showMsg("비밀번호를 입력해 주세요.", "err"); pw.focus(); return; }

    busy = true;
    btn.disabled = true;
    btn.textContent = "여는 중…";
    showMsg("");
    try {
      var list = await openSealed(pass);
      bootApp(list);
      setLocked(false);
      fails = 0;
      pw.value = "";                        /* 입력한 비밀번호를 화면에서도 지움 */
      pw.type = "password";
      eye.setAttribute("aria-pressed", "false");
      saveKeep(keepEl.checked);
      try { window.scrollTo(0, 0); } catch(e){}
    } catch (e) {
      fails++;
      lockEl.classList.remove("lock-badv");
      void lockEl.offsetWidth;
      lockEl.classList.add("lock-badv");
      if (fails >= MAX_FAILS){
        var wait = Math.min(300000, 15000 * Math.pow(2, Math.floor(fails / MAX_FAILS) - 1));
        cooldownUntil = Date.now() + wait;
        showMsg("비밀번호가 맞지 않습니다. " + Math.round(wait / 1000) + "초 뒤에 다시 시도할 수 있어요.", "err");
      } else if (e && e.name === "OperationError"){
        showMsg("비밀번호가 맞지 않습니다. (" + fails + "/" + MAX_FAILS + ")", "err");
      } else {
        showMsg((e && e.message) || "잠금을 풀지 못했습니다.", "err");
      }
      try { pw.select(); } catch(e2){}
    } finally {
      busy = false;
      btn.disabled = false;
      btn.textContent = "잠금 해제";
    }
  }

  /* ---------- 잠금 / 로그아웃 ---------- */
  function lockNow(){
    setLocked(true);
    showMsg("");
    try {
      if (booted && window.__hhSetEvents) window.__hhSetEvents([]);
      var sb = document.getElementById("sheetBody"); if (sb) sb.innerHTML = "";
      var sc = document.getElementById("scrim"); if (sc) sc.classList.remove("on");
      var sb2 = document.getElementById("sheet"); if (sb2) sb2.classList.remove("on");
      var mn = document.getElementById("main"); if (mn) mn.innerHTML = "";
    } catch(e){}
  }
  function logout(){
    var ok = window.confirm(
      "로그아웃할까요?\n\n이 기기에 저장된 완료 체크·메모·필터 설정을 지우고 다시 잠습니다.\n" +
      "일정 데이터는 암호화된 상태로 남아 있어 비밀번호로 다시 열 수 있습니다.");
    if (!ok) return;
    ["haruharu.done.v1", "haruharu.memo.v1", "haruharu.filter.v1"].forEach(function(k){
      try { localStorage.removeItem(k); } catch(e){}
    });
    try { sessionStorage.clear(); } catch(e){}
    location.reload();
  }

  /* ---------- 초기화 ---------- */
  function init(){
    try { sealed = parseSealed(SEALED); }
    catch (e) {
      showMsg((e && e.message) || "앱 데이터를 읽지 못했습니다.", "err");
      btn.disabled = true;
      return;
    }
    if (!window.crypto || !window.crypto.subtle || !window.TextDecoder){
      showMsg("이 브라우저에서는 암호화 잠금을 쓸 수 없습니다. https 주소나 localhost로 열어 주세요.", "err");
      btn.disabled = true;
      pw.disabled = true;
      return;
    }

    form.addEventListener("submit", unlock);
    eye.addEventListener("click", function(){
      var show = pw.type === "password";
      pw.type = show ? "text" : "password";
      eye.setAttribute("aria-pressed", show ? "true" : "false");
      eye.setAttribute("aria-label", show ? "비밀번호 가리기" : "비밀번호 보기");
      try { pw.focus(); } catch(e){}
    });
    keepEl.addEventListener("change", function(){ saveKeep(keepEl.checked); });
    logoutEl.addEventListener("click", logout);

    window.__hhLock = lockNow;
    window.__hhLogout = logout;
    window.__hhKeepOn = loadKeep;
    window.__hhSetKeep = saveKeep;
    window.__hhSyncKeep = syncKeep;
    window.__hhIter = sealed.iter;

    syncKeep();
    setLocked(true);

    document.addEventListener("visibilitychange", function(){
      if (document.hidden){ hiddenAt = Date.now(); return; }
      if (hiddenAt && !appEl.hidden && !loadKeep() && Date.now() - hiddenAt > AUTOLOCK_MS) lockNow();
      hiddenAt = 0;
    });
    window.addEventListener("pageshow", function(ev){
      if (ev && ev.persisted && !appEl.hidden && !loadKeep()) lockNow();
    });

    if ("serviceWorker" in navigator &&
        (location.protocol === "https:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>

<script>
window.__hhBootApp = function(EVENTS){
  "use strict";

  /* ---------------- constants ---------------- */
  var CATS = {
    class:   { label: "수업",       color: "var(--class)",   varName: "class" },
    task:    { label: "과제·시험",  color: "var(--task)",    varName: "task" },
    contest: { label: "공모전·팀모집", color: "var(--contest)", varName: "contest" },
    life:    { label: "알바·일정",  color: "var(--life)",    varName: "life" }
  };
  var CAT_ORDER = ["class", "task", "contest", "life"];
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var DOW_FULL = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
  var PX_PER_MIN = 64 / 60;
  var LS = { done: "haruharu.done.v1", memo: "haruharu.memo.v1", theme: "haruharu.theme.v1", filter: "haruharu.filter.v1", keep: "haruharu.keep.v1" };
  var DATA_MIN = todayISO(), DATA_MAX = todayISO();
  EVENTS.forEach(function(e){
    var end = (e.dateEnd && e.dateEnd > e.date) ? e.dateEnd : e.date;
    if (e.date < DATA_MIN) DATA_MIN = e.date;
    if (end > DATA_MAX) DATA_MAX = end;
  });

  /* ---------------- storage ---------------- */
  function load(key, def){
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch(e){ return def; }
  }
  function save(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
  }

  function storageOK(){
    try { localStorage.setItem("__hh", "1"); localStorage.removeItem("__hh"); return true; }
    catch(e){ return false; }
  }
  var doneMap = load(LS.done, {});
  var memoMap = load(LS.memo, {});
  var state = {
    date: todayISO(),
    filter: load(LS.filter, "all") || "all",
    lastDate: null
  };

  /* ---------------- date helpers ---------------- */
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(s, n){ var d = parseISO(s); d.setDate(d.getDate()+n); return ymd(d); }
  function dowOf(s){ return parseISO(s).getDay(); }
  function isBetween(d, a, b){ return d >= a && d <= b; }
  function mOf(hhmm){ var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]); }
  var TERM_START = new Date(2026, 7, 31);   // 2026-2학기 1주차 시작(월)
  function academicWeek(s){
    var d = parseISO(s);
    var diff = Math.floor((d - TERM_START) / 86400000);
    if (diff < -6) return null;
    var w = Math.floor((diff + 7) / 7);
    if (w < 1 || w > 18) return null;
    return w < 10 ? "0" + w : "" + w;
  }

  /* ---------------- data helpers ---------------- */
  function eventsOn(dateStr){
    return EVENTS.filter(function(e){ return e.date === dateStr; });
  }
  function spansOn(dateStr){
    return EVENTS.filter(function(e){ return e.dateEnd && e.date < dateStr && dateStr <= e.dateEnd; });
  }
  function dayEvents(dateStr){
    var list = eventsOn(dateStr);
    if (state.filter !== "all") list = list.filter(function(e){ return e.cat === state.filter; });
    return list;
  }
  function keyOf(e){ return e.id + "|" + e.date; }
  function isDone(e){ return !!doneMap[keyOf(e)]; }
  function evTimeLabel(e){
    if (e.allDay) return "종일";
    if (e.deadline) return e.start + " 마감";
    return e.start + " – " + e.end;
  }
  function catLabel(c){ return CATS[c] ? CATS[c].label : ""; }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  /* ---------------- check / memo ---------------- */
  function toggleDone(e){
    var k = keyOf(e);
    if (doneMap[k]) delete doneMap[k]; else doneMap[k] = 1;
    save(LS.done, doneMap);
  }
  function memosOn(dateStr){ return memoMap[dateStr] || []; }
  function addMemo(dateStr, text){
    text = (text || "").trim();
    if (!text) return;
    var arr = memoMap[dateStr] || (memoMap[dateStr] = []);
    arr.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), text: text });
    save(LS.memo, memoMap);
  }
  function delMemo(dateStr, id){
    var arr = memoMap[dateStr] || [];
    memoMap[dateStr] = arr.filter(function(m){ return m.id !== id; });
    save(LS.memo, memoMap);
  }

  /* ---------------- theme ---------------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#0b0d12" : "#F2F5FA");
  }
  (function initTheme(){
    var saved = load(LS.theme, null);
    if (!saved){
      saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    applyTheme(saved);
  })();

  /* ---------------- rendering ---------------- */
  var $ = function(id){ return document.getElementById(id); };
  var main = $("main");

  function renderWeek(){
    var sel = state.date;
    var d = parseISO(sel);
    var start = addDays(sel, -d.getDay());  // 일요일 시작
    var html = "";
    for (var i = 0; i < 7; i++){
      var ds = addDays(start, i), dd = parseISO(ds), dow = dd.getDay();
      var evs = eventsOn(ds);
      var cats = {};
      evs.forEach(function(e){ cats[e.cat] = 1; });
      var dots = "";
      CAT_ORDER.forEach(function(c){
        if (cats[c]) dots += '<i style="background:' + CATS[c].color + '"></i>';
      });
      // 일정이 0개인 날은 자리만 잡고 점은 보이지 않게(.empty)
      if (!dots) dots = '<i class="empty"></i>';
      var cls = ["wday"];
      if (dow === 0) cls.push("sun");
      if (dow === 6) cls.push("sat");
      if (ds === sel) cls.push("sel");
      if (ds === todayISO()) cls.push("today");
      html += '<button class="' + cls.join(" ") + '" data-day="' + ds + '" aria-label="' + dd.getMonth()+1 + '월 ' + dd.getDate() + '일 ' + DOW_FULL[dow] + '">'
            + '<span class="wd">' + DOW[dow] + '</span>'
            + '<span class="wn">' + dd.getDate() + '</span>'
            + '<span class="dots">' + dots + '</span></button>';
    }
    $("week").innerHTML = html;
  }

  function renderFilters(){
    var all = eventsOn(state.date);
    var counts = { all: all.length };
    CAT_ORDER.forEach(function(c){ counts[c] = 0; });
    all.forEach(function(e){ if (counts[e.cat] != null) counts[e.cat]++; });
    var defs = [{ k: "all", label: "전체" }].concat(CAT_ORDER.map(function(c){ return { k: c, label: CATS[c].label }; }));
    $("filters").innerHTML = defs.map(function(f){
      var pressed = state.filter === f.k;
      var dot = f.k === "all" ? "" : '<i style="background:' + CATS[f.k].color + '"></i>';
      return '<button class="chip" data-filter="' + f.k + '" data-cat="' + f.k + '" aria-pressed="' + pressed + '">'
        + dot + f.label + '<span class="num">' + (counts[f.k] || 0) + '</span></button>';
    }).join("");
  }

  function renderHeader(){
    var ds = state.date, d = parseISO(ds), dow = d.getDay();
    var cls = dow === 0 ? "sun" : (dow === 6 ? "sat" : "");
    $("dmain").innerHTML = (d.getMonth()+1) + "월 " + d.getDate() + "일 <span class=\"dow" + (cls ? " " + cls : "") + "\">" + DOW_FULL[dow] + "</span>";

    var evs = eventsOn(ds);
    var total = evs.length, done = evs.filter(isDone).length;
    var pct = total ? Math.round(done / total * 100) : 0;

    var sub = [];
    if (ds === todayISO()) sub.push('<span class="pill today">오늘</span>');
    var wk = academicWeek(ds);
    if (wk) sub.push('<span class="pill">' + wk + '주차</span>');
    sub.push('<span class="pill">일정 ' + total + '개</span>');
    if (total) sub.push('<span class="pill prog"><span class="mini"><i style="width:' + pct + '%"></i></span>' + done + '/' + total + '</span>');
    $("dsub").innerHTML = sub.join(" ");

    var tb = $("todayBtn");
    if (ds === todayISO()){ tb.classList.remove("ghost"); tb.textContent = "오늘"; }
    else {
      tb.classList.add("ghost");
      tb.textContent = addDays(ds, 1) === todayISO() ? "어제로" : (addDays(ds, -1) === todayISO() ? "내일로" : "오늘로");
    }
  }

  function cardHTML(e, small){
    var done = isDone(e);
    var cls = "card cat-" + e.cat + (done ? " done" : "");
    var tags = '<span class="tag">' + catLabel(e.cat) + '</span>';
    if (e.dateEnd) tags += '<span class="tag">기간</span>';
    var sub = [];
    if (e.dateEnd) sub.push(e.date.slice(5).replace("-","/") + "~" + e.dateEnd.slice(5).replace("-","/"));
    if (e.sub) sub.push(e.sub);
    return '<div class="' + cls + '" data-ev="' + esc(e.id) + '" data-date="' + e.date + '">'
      + '<button class="ck" data-check="' + esc(e.id) + '" data-date="' + e.date + '" role="checkbox" aria-checked="' + done + '" aria-label="완료 표시"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></button>'
      + '<div class="body" role="button" tabindex="0" data-open="' + esc(e.id) + '" data-date="' + e.date + '">'
        + '<div class="meta"><span class="tm">' + evTimeLabel(e) + '</span>' + tags + '</div>'
        + '<div class="title">' + esc(e.title) + '</div>'
        + (sub.length ? '<div class="sub">' + esc(sub.join(" · ")) + '</div>' : '')
      + '</div></div>';
  }

  function layoutOverlaps(evs){
    var sorted = evs.slice().sort(function(a,b){
      return mOf(a.start) - mOf(b.start) || mOf(b.end) - mOf(a.end);
    });
    var clusters = [], cur = [], curEnd = -1;
    sorted.forEach(function(e){
      var s = mOf(e.start), en = Math.max(mOf(e.end), s + 25);
      if (cur.length && s < curEnd){ cur.push(e); curEnd = Math.max(curEnd, en); }
      else { if (cur.length) clusters.push(cur); cur = [e]; curEnd = en; }
    });
    if (cur.length) clusters.push(cur);
    clusters.forEach(function(c){
      var colEnd = [];
      c.forEach(function(e){
        var s = mOf(e.start), en = Math.max(mOf(e.end), s + 25), placed = false;
        for (var i = 0; i < colEnd.length; i++){
          if (colEnd[i] <= s){ colEnd[i] = en; e._col = i; placed = true; break; }
        }
        if (!placed){ e._col = colEnd.length; colEnd.push(en); }
      });
      c.forEach(function(e){ e._cols = colEnd.length; });
    });
    return sorted;
  }

  function renderTimeline(list){
    var timed = list.filter(function(e){ return !e.pinned; });
    if (!timed.length) return "";
    var laid = layoutOverlaps(timed);

    var minM = 8 * 60, maxM = 20 * 60;
    laid.forEach(function(e){
      minM = Math.min(minM, mOf(e.start));
      maxM = Math.max(maxM, mOf(e.end));
    });
    minM = Math.floor(minM / 60) * 60;
    maxM = Math.ceil(maxM / 60) * 60;
    var height = (maxM - minM) * PX_PER_MIN;

    var labels = "";
    for (var h = minM; h <= maxM; h += 60){
      var y = (h - minM) * PX_PER_MIN;
      labels += '<div class="h" style="top:' + y + 'px">' + pad(Math.floor(h/60) % 24) + ':00</div>';
    }
    var grid = "";
    for (var hh = minM; hh <= maxM; hh += 30){
      var y2 = (hh - minM) * PX_PER_MIN;
      grid += '<div class="gline' + (hh % 60 ? " half" : "") + '" style="top:' + y2 + 'px"></div>';
    }

    var nowLine = "";
    if (state.date === todayISO()){
      var n = new Date(), nm = n.getHours()*60 + n.getMinutes();
      if (nm >= minM && nm <= maxM){
        nowLine = '<div class="now" style="top:' + ((nm - minM) * PX_PER_MIN) + 'px"></div>';
      }
    }

    var items = laid.map(function(e){
      var s = mOf(e.start), en = Math.max(mOf(e.end), s + 25);
      var top = (s - minM) * PX_PER_MIN;
      var hgt = Math.max((en - s) * PX_PER_MIN, 30);
      var cols = e._cols || 1, col = e._col || 0;
      var w = 100 / cols;
      var left = "calc(" + (col * w) + "% + 2px)";
      var width = "calc(" + w + "% - 6px)";
      var tiny = hgt < 48 ? " tiny" : "";
      var done = isDone(e) ? " done" : "";
      return '<div class="ev cat-' + e.cat + tiny + done + '" data-ev="' + esc(e.id) + '" data-date="' + e.date + '"'
        + ' style="top:' + top.toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px;left:' + left + ';width:' + width + '"'
        + ' role="button" tabindex="0" data-open="' + esc(e.id) + '" data-date="' + e.date + '">'
        + '<button class="ck" data-check="' + esc(e.id) + '" data-date="' + e.date + '" role="checkbox" aria-checked="' + (done ? "true" : "false") + '" aria-label="완료 표시"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></button>'
        + '<div class="et">' + e.start + '</div>'
        + '<div class="en">' + esc(e.title) + '</div>'
        + '<div class="el">' + esc(e.sub || "") + '</div>'
        + '</div>';
    }).join("");

    return '<div class="sec-h">타임라인<span class="rule"></span><span class="cnt">' + laid.length + '개</span></div>'
      + '<div class="tl" style="height:' + height + 'px">'
      +   '<div class="hlabels">' + labels + '</div>'
      +   '<div class="track" style="height:' + height + 'px">' + grid + nowLine + items + '</div>'
      + '</div>';
  }

  function render(){
    renderWeek();
    renderFilters();
    renderHeader();

    var ds = state.date;
    var all = dayEvents(ds);
    var pinned = all.filter(function(e){ return e.pinned; });
    var html = "";

    // 기간 진행 중 배너
    var spans = spansOn(ds);
    if (spans.length){
      html += spans.map(function(s){
        return '<div class="span-banner"><span class="k">기간</span><span>' + esc(s.title) + ' · '
          + s.date.slice(5).replace("-","/") + '~' + s.dateEnd.slice(5).replace("-","/") + ' 진행 중</span></div>';
      }).join("");
    }

    if (pinned.length){
      html += '<div class="sec-h">종일 · 마감<span class="rule"></span><span class="cnt">' + pinned.length + '개</span></div>';
      html += '<div class="pin">' + pinned.map(function(e){ return cardHTML(e); }).join("") + '</div>';
    }

    html += renderTimeline(all);

    // 메모
    var memos = memosOn(ds);
    html += '<div class="sec-h">메모<span class="rule"></span><span class="cnt">' + memos.length + '개</span></div>';
    html += '<div class="memo" id="memoList">';
    html += memos.map(function(m){
      return '<div class="memo-item"><span class="mtxt">' + esc(m.text) + '</span>'
        + '<button class="mdel" data-del="' + m.id + '" aria-label="메모 삭제">×</button></div>';
    }).join("");
    html += '</div>';
    html += '<div class="memo-add"><input id="memoInput" type="text" placeholder="이 날 메모 추가 (예: 계산기 챙기기)" maxlength="200" enterkeyhint="done" autocomplete="off">'
      + '<button id="memoBtn" aria-label="메모 저장">↑</button></div>';

    var hasTimed = all.some(function(e){ return !e.pinned; });
    if (!pinned.length && !hasTimed && !spans.length){
      html = '<div class="empty"><div class="e1">🌤️</div><div class="e2">이 날은 일정이 없어요</div>'
        + '<div class="e3">' + (state.filter === "all" ? "비어 있는 하루도 좋아요. 메모만 남겨도 됩니다." : "다른 카테고리에 일정이 있을 수 있어요.") + '</div></div>'
        + '<div class="sec-h">메모<span class="rule"></span><span class="cnt">' + memos.length + '개</span></div>'
        + '<div class="memo" id="memoList">' + memos.map(function(m){
            return '<div class="memo-item"><span class="mtxt">' + esc(m.text) + '</span>'
              + '<button class="mdel" data-del="' + m.id + '" aria-label="메모 삭제">×</button></div>';
          }).join("") + '</div>'
        + '<div class="memo-add"><input id="memoInput" type="text" placeholder="이 날 메모 추가" maxlength="200" enterkeyhint="done" autocomplete="off">'
        + '<button id="memoBtn" aria-label="메모 저장">↑</button></div>';
    }

    main.innerHTML = html;

    // 오늘/첫 일정 위치로 스크롤 (날짜가 바뀔 때만)
    if (state.lastDate !== ds){
      state.lastDate = ds;
      requestAnimationFrame(function(){
        var target = main.querySelector(".now");
        if (!target){
          var first = main.querySelector(".ev");
          target = first;
        }
        if (target){
          var y = target.getBoundingClientRect().top + window.scrollY - 236;
          window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
        } else {
          window.scrollTo({ top: 0, behavior: "auto" });
        }
      });
    }

    $("footnote").textContent = "2026-11-23 조회 기준 · Google 캘린더 + 수강 시간표"
      + (storageOK() ? " · 체크와 메모는 이 브라우저에만 저장됩니다" : " · ⚠️ 이 환경에서는 체크·메모가 저장되지 않습니다(파일로 열었을 때)");
  }

  /* ---------------- navigation ---------------- */
  function go(delta){
    var next = addDays(state.date, delta);
    var dir = delta < 0 ? "slide-l" : "slide-r";
    main.classList.add(dir);
    setTimeout(function(){
      state.date = next;
      main.classList.remove(dir);
      render();
    }, 90);
  }
  function setDate(ds){
    if (ds === state.date) return;
    state.date = ds;
    render();
  }

  /* ---------------- sheet ---------------- */
  var scrim = $("scrim"), sheet = $("sheet"), sheetBody = $("sheetBody");
  function openSheet(html){
    sheetBody.innerHTML = html;
    scrim.classList.add("on");
    sheet.style.transform = "";
    sheet.classList.add("on");
    document.body.style.overflow = "hidden";
  }
  function closeSheet(){
    sheet.classList.remove("on");
    scrim.classList.remove("on");
    document.body.style.overflow = "";
  }
  function findEv(id, date){
    for (var i = 0; i < EVENTS.length; i++){
      if (EVENTS[i].id === id && EVENTS[i].date === date) return EVENTS[i];
    }
    return null;
  }
  function openEvent(e){
    if (!e) return;
    var done = isDone(e);
    var rows = "";
    rows += '<div class="srow"><div class="k">시간</div><div>' + esc(evTimeLabel(e)) + (e.dateEnd ? ' · ' + e.date.slice(5).replace("-","/") + '~' + e.dateEnd.slice(5).replace("-","/") : '') + '</div></div>';
    if (e.loc) rows += '<div class="srow"><div class="k">장소</div><div>' + esc(e.loc) + '</div></div>';
    rows += '<div class="srow"><div class="k">분류</div><div>' + catLabel(e.cat) + '</div></div>';
    openSheet(
      '<div class="smeta"><span class="tag" style="background:color-mix(in srgb,' + CATS[e.cat].color + ' 16%, transparent);color:' + CATS[e.cat].color + '">' + catLabel(e.cat) + '</span>'
      + (e.deadline ? '<span class="tag" style="background:var(--task-soft);color:var(--task)">마감</span>' : '')
      + '</div>'
      + '<h2 id="sheetTitle">' + esc(e.title) + '</h2>'
      + rows
      + (e.desc ? '<div class="desc" style="margin-top:12px">' + esc(e.desc) + '</div>' : '')
      + '<div class="act">'
      +   '<button class="btn primary" id="sheetDone">' + (done ? "완료 취소" : "완료로 표시") + '</button>'
      +   '<button class="btn" id="sheetClose">닫기</button>'
      + '</div>'
      + '<div class="hint">일정 원문은 Google 캘린더(solive06@naver.com)에서 가져왔습니다. 수업 항목은 수강편람·교수계획표 기준입니다.</div>'
    );
    $("sheetDone").addEventListener("click", function(){
      toggleDone(e);
      render();
      closeSheet();
      toast(isDone(e) ? "완료로 표시했어요" : "완료를 취소했어요");
    });
    $("sheetClose").addEventListener("click", closeSheet);
  }

  function openMemoSheet(){
    openSheet(
      '<h2 id="sheetTitle">빠른 메모</h2>'
      + '<div class="hint" style="margin:0 0 10px">' + parseISO(state.date).getMonth()+1 + '월 ' + parseISO(state.date).getDate() + '일 · ' + DOW_FULL[dowOf(state.date)] + ' 에 저장됩니다.</div>'
      + '<textarea class="memo-input" id="memoText" placeholder="예: 이번 주 리포트 마감일 확인"></textarea>'
      + '<div class="act"><button class="btn primary" id="memoSave">저장</button><button class="btn" id="memoCancel">취소</button></div>'
    );
    var ta = $("memoText");
    setTimeout(function(){ try { ta.focus(); } catch(e){} }, 260);
    $("memoSave").addEventListener("click", function(){
      var v = ta.value;
      if (!v.trim()){ toast("메모 내용을 입력해 주세요"); return; }
      addMemo(state.date, v);
      closeSheet();
      render();
      toast("메모를 저장했어요");
    });
    $("memoCancel").addEventListener("click", closeSheet);
  }

  function openInfo(){
    var n = EVENTS.length;
    openSheet(
      '<h2 id="sheetTitle">하루하루 · 앱 정보</h2>'
      + '<div class="hint" style="margin:2px 0 0">하루 단위로 보는 데일리 일정 뷰어입니다.</div>'
      + '<div class="info-h">쓰는 법</div>'
      + '<ul class="info-list">'
      +   '<li>좌우로 밀거나 상단 ◀ 어제 / 내일 ▶ 로 하루씩 이동</li>'
      +   '<li>주간 날짜 바에서 원하는 날을 바로 선택</li>'
      +   '<li>동그라미를 눌러 완료 체크, 카드를 눌러 상세 내용 보기</li>'
      +   '<li>오른쪽 아래 + 로 그날 메모 추가</li>'
      +   '<li>체크·메모는 이 브라우저(localStorage)에만 저장됩니다</li>'
      + '</ul>'
      + '<div class="info-h">담긴 데이터</div>'
      + '<ul class="info-list">'
      +   '<li>Google 캘린더 일정과 주간 반복 수업, 모두 ' + n + '개</li>'
      +   '<li>반복 수업은 12~15주차까지 표시됩니다</li>'
      +   '<li>기말고사 기간은 별도 기간 일정으로 표시됩니다</li>'
      +   '<li>종료 시각은 확인된 값이 아니어서 75분 기준으로 표시했습니다</li>'
      +   '<li>정규 수업 시간이 확인되지 않은 과목은 공지된 일정만 넣었습니다</li>'
      +   '<li>빼기로 한 일정은 넣지 않았습니다</li>'
      + '</ul>'
      + '<div class="info-h">보안</div>'
      + '<div class="sec-row"><div><div class="sl">잠금 유지</div>'
      +   '<div class="sd" id="keepState"></div></div>'
      +   '<button class="switch" id="keepSwitch" role="switch" aria-checked="false" aria-label="잠금 유지"></button></div>'
      + '<div class="sec-row"><div><div class="sl">지금 잠금</div>'
      +   '<div class="sd">풀린 일정을 메모리에서 지우고 바로 다시 잠깁니다</div></div>'
      +   '<button class="btn" id="lockNowBtn" style="flex:0 0 auto;height:38px;padding:0 15px;font-size:12.5px">잠금</button></div>'
      + '<div class="sec-row"><div><div class="sl">로그아웃</div>'
      +   '<div class="sd">이 기기의 완료 체크·메모·설정을 지웁니다</div></div>'
      +   '<button class="btn danger" id="logoutBtn" style="flex:0 0 auto;height:38px;padding:0 15px;font-size:12.5px">로그아웃</button></div>'
      + '<div class="hint">일정은 PBKDF2-SHA256(반복 ' + (window.__hhIter || 200000) + '회) + AES-256-GCM으로 잠겨 있고, 비밀번호를 넣어야만 이 브라우저 메모리에서 풀립니다. 비밀번호를 잃으면 되살릴 수 없습니다.</div>'
      + '<div class="act"><button class="btn primary" id="infoClose">닫기</button></div>'
    );
    $("infoClose").addEventListener("click", closeSheet);
    var sw = $("keepSwitch");
    if (sw){
      if (window.__hhSyncKeep) window.__hhSyncKeep();
      sw.addEventListener("click", function(){
        if (window.__hhSetKeep) window.__hhSetKeep(!(window.__hhKeepOn && window.__hhKeepOn()));
      });
    }
    var ln = $("lockNowBtn");
    if (ln) ln.addEventListener("click", function(){ closeSheet(); if (window.__hhLock) window.__hhLock(); });
    var lo = $("logoutBtn");
    if (lo) lo.addEventListener("click", function(){ if (window.__hhLogout) window.__hhLogout(); });
  }

  /* ---------------- toast ---------------- */
  var toastEl = $("toast"), toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 1800);
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function(ev){
    var t = ev.target;
    var chip = t.closest && t.closest("[data-filter]");
    if (chip){
      state.filter = chip.getAttribute("data-filter");
      save(LS.filter, state.filter);
      render();
      return;
    }
    var day = t.closest && t.closest("[data-day]");
    if (day){ setDate(day.getAttribute("data-day")); return; }

    var ck = t.closest && t.closest("[data-check]");
    if (ck){
      ev.stopPropagation();
      var e1 = findEv(ck.getAttribute("data-check"), ck.getAttribute("data-date"));
      if (e1){ toggleDone(e1); render(); toast(isDone(e1) ? "완료로 표시했어요" : "완료를 취소했어요"); }
      return;
    }
    var open = t.closest && t.closest("[data-open]");
    if (open){
      openEvent(findEv(open.getAttribute("data-open"), open.getAttribute("data-date")));
      return;
    }
    var del = t.closest && t.closest("[data-del]");
    if (del){ delMemo(state.date, del.getAttribute("data-del")); render(); return; }
    if (t.id === "memoBtn" || (t.closest && t.closest("#memoBtn"))){
      var inp = $("memoInput");
      if (inp && inp.value.trim()){ addMemo(state.date, inp.value); render(); toast("메모를 저장했어요"); }
      else if (inp){ inp.focus(); }
      return;
    }
  });

  document.addEventListener("keydown", function(ev){
    var tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") {
      if (ev.key === "Enter" && ev.target.id === "memoInput"){
        ev.preventDefault();
        if (ev.target.value.trim()){ addMemo(state.date, ev.target.value); render(); toast("메모를 저장했어요"); }
      }
      return;
    }
    if (ev.key === "ArrowLeft") go(-1);
    else if (ev.key === "ArrowRight") go(1);
    else if (ev.key === "t" || ev.key === "T") setDate(todayISO());
    else if (ev.key === "Escape") closeSheet();
    else if (ev.key === "Enter" || ev.key === " "){
      var el = ev.target.closest && ev.target.closest("[data-open]");
      if (el){ ev.preventDefault(); openEvent(findEv(el.getAttribute("data-open"), el.getAttribute("data-date"))); }
    }
  });

  $("prevBtn").addEventListener("click", function(){ go(-1); });
  $("nextBtn").addEventListener("click", function(){ go(1); });
  $("todayBtn").addEventListener("click", function(){ setDate(todayISO()); });
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(cur);
    save(LS.theme, cur);
  });
  $("infoBtn").addEventListener("click", openInfo);
  $("nowLockBtn").addEventListener("click", function(){ if (window.__hhLock) window.__hhLock(); });
  $("fab").addEventListener("click", openMemoSheet);
  scrim.addEventListener("click", closeSheet);

  // 스와이프
  var touch = { x: 0, y: 0, t: 0, active: false };
  var area = document.querySelector(".app");
  area.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    touch = { x: t.clientX, y: t.clientY, t: Date.now(), active: true };
  }, { passive: true });
  area.addEventListener("touchend", function(e){
    if (!touch.active) return;
    touch.active = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - touch.x, dy = t.clientY - touch.y, dt = Date.now() - touch.t;
    if (dt > 700) return;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    go(dx > 0 ? -1 : 1);
  }, { passive: true });

  // 첫 진입: 데이터 범위 밖이면 가장 가까운 일정 있는 날로
  (function initDate(){
    var t = todayISO();
    if (t < DATA_MIN || t > DATA_MAX){
      state.date = (t < DATA_MIN) ? DATA_MIN : DATA_MAX;
    }
  })();

  // 잠금이 다시 걸렸다가 풀릴 때, 복호화한 일정만 갈아끼우는 통로
  window.__hhSetEvents = function(list){ EVENTS = list; render(); };

  render();
};
</script>
</body>
</html>
